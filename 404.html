<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Cook at Home</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --cream: #FDF6E3; --warm-brown: #8B4513; --rust: #C65D3B; --dark-wood: #3D2914; --butter: #F5DEB3; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Libre Baskerville', Georgia, serif; background: var(--cream); color: var(--dark-wood); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .handwritten { font-family: 'Caveat', cursive; }
        .container { max-width: 500px; }
        .emoji { font-size: 6rem; margin-bottom: 1rem; }
        h1 { font-size: 3rem; color: var(--warm-brown); margin-bottom: 0.5rem; }
        p { font-size: 1.1rem; margin-bottom: 2rem; line-height: 1.6; }
        .btn { display: inline-block; background: var(--rust); color: white; padding: 1rem 2rem; border-radius: 30px; text-decoration: none; transition: all 0.3s; }
        .btn:hover { background: var(--warm-brown); transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🍳</div>
        <h1 class="handwritten">Oops!</h1>
        <p>Looks like this recipe wandered off the counter. The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn">Back to Kitchen</a>
    </div>
</body>
</html>
